a { color: var(--amber); text-decoration: none; }

.statusbar { position: fixed; top: 0; left: 0; right: 0; border-bottom: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; font-size: 11px; color: var(--dim); letter-spacing: 0.06em; z-index: 50; gap: 12px; }

.statusbar .right { display: flex; align-items: center; gap: 14px; }
.lang-toggle { display: flex; align-items: center; gap: 6px; }
.lang-sep { color: var(--dim); font-size: 11px; }
.lang-btn { background: none; border: none; font-family: var(--font); font-size: 11px; cursor: pointer; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px; }
.lang-btn.active { color: var(--text); font-weight: 700; }
.lang-btn:hover { color: var(--text); }

.hero { padding: 140px 10vw 60px; }
.hero-name { font-family: var(--font-mark); font-size: clamp(32px, 6vw, 64px); font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1; display: block; margin-bottom: 16px; }
.hero-divider { width: 100%; height: 1px; background: var(--line); margin-bottom: 24px; }
.hero-note { font-size: 13px; color: var(--dim); max-width: 560px; line-height: 1.8; }
.hero-note .flag { color: var(--amber); }

.section { padding: 48px 10vw; border-top: 1px solid var(--line); }
.section-grid { display: grid; grid-template-columns: 200px 1fr; gap: 48px; align-items: start; }
.section-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding-top: 3px; }
.section-label .prefix { color: var(--amber); font-size: 10px; }

.about-text p { font-size: 14px; color: var(--text); line-height: 2; margin-bottom: 14px; max-width: 640px; }
.about-text p:last-child { margin-bottom: 0; }

footer { border-top: 1px solid var(--line); padding: 24px 10vw 64px; display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); letter-spacing: 0.05em; flex-wrap: wrap; gap: 8px; }

@media (max-width: 700px) {
  .hero { padding: 110px 6vw 40px; }
  .section { padding: 36px 6vw; }
  .section-grid { grid-template-columns: 1fr; gap: 16px; }

function paramLang(){
  const p = new URLSearchParams(location.search).get('lang');
  return p === 'en' ? 'en' : 'ru';
}

let lang = paramLang();

function g(id){ return document.getElementById(id); }
function t(k){ return C[lang][k] !== undefined ? C[lang][k] : C.en[k]; }

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  g('btn-ru').classList.toggle('active', l === 'ru');
  g('btn-en').classList.toggle('active', l === 'en');
  render();
}

function render(){
  g('sb-label').textContent = t('sbLabel');
  g('back-link').textContent = t('backLink');
  g('hero-note').textContent = t('heroNote');

  });
  g('ft-r').textContent = t('ftR');
  g('ft-updated').innerHTML = t('ftUpdated');
}

g('btn-ru').classList.toggle('active', lang === 'ru');
g('btn-en').classList.toggle('active', lang === 'en');
document.documentElement.lang = lang;
